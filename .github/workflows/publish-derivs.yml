name: Fast publish (derivs data)
# also market/macro-only data (15 Oct P0); the name is kept so run history and last_good.sh stay continuous

# FAST path for derivs-only data commits (target < 8 min from the derivatives run to live). Dispatched by derivs.yml after its push.
# Runs only the data gates below, deploys, smoke-tests live and rolls back automatically. Any failure = nothing published:
# live keeps the last good files and the app shows those cards as stale. Code changes and anything beyond derivs.json/_runs.json
# go through the full "CI and deploy" (path selection: .github/scripts/publish_path.py); the full suite also runs daily (live-suite.yml).
on:
  workflow_dispatch:
    inputs:
      derivs_run_at:
        description: 'time the triggering data run produced its data (derivs: _runs.json last_run; market: market.json updated), for the end-to-end time'
        required: false

permissions:
  contents: read

# own group: never queued behind (or cancelled by) the 25+ min full CI. A newer pending publish replaces an older pending one,
# which is fine: it carries newer data.
concurrency:
  group: publish-derivs
  cancel-in-progress: false

env:
  SITE_URL: https://atenra-tech.github.io/rp-terminal/
  NODE_PATH: ${{ github.workspace }}/tests/node_modules

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      path: ${{ steps.path.outputs.path }}
      market: ${{ steps.path.outputs.market }}
      sha: ${{ steps.path.outputs.sha }}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Path selection (fast only when nothing but derivs.json/_runs.json differs from the last good deploy)
        id: path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 16 Oct (starvation fix): compare with the TESTED code commit (refs/tags/pages-tested), not the last good deploy; the data path always deploys
          good=$(bash .github/scripts/tested_sha.sh)
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -z "$good" ]; then echo "path=fast" >> "$GITHUB_OUTPUT"; echo "code=true" >> "$GITHUB_OUTPUT"; echo "::warning::no tested code commit found"; exit 0; fi
          git fetch -q origin "$good" 2>/dev/null || true; python3 .github/scripts/publish_path.py "$good" HEAD
      - name: Untested code on main - request a full CI run for it (this run still deploys data with the tested code)
        if: steps.path.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # only when no CI run of main is already queued or running (the push run usually is): never piles up runs that replace each other
          busy=$(gh run list --repo "$GITHUB_REPOSITORY" -w ci.yml -b main -L 10 --json status -q '[.[]|select(.status!="completed")]|length' || echo 0)
          if [ "${busy:-0}" -gt 0 ]; then echo "CI already queued/running on main ($busy): no extra dispatch"; exit 0; fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f data_redeploy=false && echo "dispatched full CI (suites) for the untested code"
      - uses: actions/setup-node@v4
        if: steps.path.outputs.path == 'fast'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/package.json
      - name: Install test deps
        if: steps.path.outputs.path == 'fast'
        run: cd tests && npm install --no-audit --no-fund --prefer-offline
      - name: Data gates (blocking, in parallel) - fixture consistency, closed hours, stale-derivs2, stale captions, card presence, OI ÷ supply label, caption sweep
        if: steps.path.outputs.path == 'fast'
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8765/index.html >/dev/null && break; sleep 1; done
          U=http://localhost:8765/index.html; mkdir -p g; t0=$(date +%s)
          node qa/fixture-consistency.js > g/fixture.log 2>&1 & p1=$!
          python3 tests/tclosed_hours.py > g/closed.log 2>&1 & p2=$!
          node qa/stale-derivs2.js $U > g/stale-derivs2.log 2>&1 & p3=$!
          DERIVS_FIXTURE=qa/fixtures/derivs-stale.json node qa/stale-captions.js $U > g/stale-captions.log 2>&1 & p4=$!
          node qa/card-presence.js $U > g/card-presence.log 2>&1 & p5=$!
          node qa/oicap-label.js $U > g/oicap.log 2>&1 & p6=$!
          node qa/caption-sweep.js $U > g/caption-sweep.log 2>&1 & p7=$!
          ps="$p1 $p2 $p3 $p4 $p5 $p6 $p7"
          if [ "${{ steps.path.outputs.market }}" = true ]; then
            # market/macro changed: dollar-token exclusion, breadth rebuild, pulse movers (the caption sweep above already covers captions)
            (cd tests && URL=$U node tdollar.js) > g/tdollar.log 2>&1 & ps="$ps $!"
            python3 tests/tbreadth.py > g/tbreadth.log 2>&1 & ps="$ps $!"
            node qa/pulse-movers.js $U > g/pulse-movers.log 2>&1 & ps="$ps $!"
          fi
          fail=0
          for p in $ps; do wait $p || fail=1; done
          for f in g/tdollar.log; do [ -f $f ] && grep -qE '^FAIL |FAILS: [1-9]' $f && fail=1; done
          for f in g/*.log; do echo "=== $f"; tail -4 "$f"; done
          echo "gates took $(( $(date +%s) - t0 ))s"
          [ $fail = 0 ] || { grep -h "^FAIL\|::error" g/*.log | head -20; echo "::error title=Fast publish blocked::a data gate failed; nothing published, live keeps the last good files"; exit 1; }

  deploy:
    # P1 (15 Oct): ONE Pages deploy at a time across ci.yml and publish-derivs.yml; a second deploy waits (never cancelled mid-deploy)
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: gates
    if: needs.gates.outputs.path == 'fast'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gates.outputs.sha }}
          fetch-depth: 0
      # P1 (15 Oct): code from refs/tags/pages-tested (last commit green on test AND live smoke), never the gated/main commit's code; data/ = newest on main
      - name: Snapshot (tested code + newest data/ from main); refuse if code or data older than live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/no_regress.py snapshot live-before.json
          code=$(bash .github/scripts/tested_sha.sh); [ -n "$code" ] || { echo "::error::no tested code commit"; exit 1; }
          bash .github/scripts/snapshot.sh _site "$code"
          # data that arrived after the gates ran gets the two data-only gates again
          cp _site/data/derivs.json data/derivs.json && python3 tests/tclosed_hours.py > closed.log || { cat closed.log; exit 1; }; echo "closed hours OK on deploy-time data"
          # market/macro taken from main HEAD after the gates ran: only publish them if they are the gated files (else keep the gated copy)
          for f in market.json macro.json; do cmp -s "_site/data/$f" "data/$f" || { echo "main has a newer $f than the gated one; publishing the gated $f (the newer one gets its own fast publish)"; cp "data/$f" "_site/data/$f"; }; done
          python3 .github/scripts/no_regress.py check _site
      - name: Log publish timing into _runs.json (published copy)
        env:
          DERIVS_RUN_AT: ${{ inputs.derivs_run_at }}
        run: |
          python3 - <<'PY'
          import json, os, datetime as d
          p = '_site/data/_runs.json'; R = json.load(open(p)); now = d.datetime.now(d.timezone.utc)
          P = lambda s: d.datetime.fromisoformat(s.replace('Z', '+00:00'))
          start = os.environ.get('DERIVS_RUN_AT') or R.get('last_run')
          M = json.load(open('_site/data/market.json')); Mu = M.get('updated')
          pub = {'path': 'fast', 'market_updated': Mu, 'workflow_run': os.environ.get('GITHUB_RUN_ID'), 'derivs_run_at': start,
                 'deploy_started': now.strftime('%Y-%m-%dT%H:%M:%SZ'), 'minutes_to_deploy': round((now - P(start)).total_seconds() / 60, 1) if start else None}
          R['publish'] = pub
          if R.get('runs'): R['runs'][-1]['publish'] = pub
          json.dump(R, open(p, 'w'), separators=(',', ':'))
          print('publish timing', pub)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-before
          path: live-before.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dep
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/package.json
      - run: cd tests && npm install --no-audit --no-fund --prefer-offline
      - uses: actions/download-artifact@v4
        with:
          name: live-before
      - name: Wait for Pages CDN to serve the new _runs.json
        run: |
          for i in $(seq 1 12); do
            v=$(curl -s "${SITE_URL}data/_runs.json?v=$(date +%s)" | python3 -c "import json,sys;print((json.load(sys.stdin).get('publish') or {}).get('workflow_run'))" 2>/dev/null)
            [ "$v" = "$GITHUB_RUN_ID" ] && { echo "live serves this publish"; break; }; sleep 10
          done
      - name: Live smoke + card presence + live never went backwards (failure rolls back)
        run: |
          set -e
          python3 .github/scripts/no_regress.py after live-before.json
          node tests/tsmoke.js "$SITE_URL"
          node qa/card-presence.js "$SITE_URL"
      - name: End-to-end time
        if: always()
        run: curl -s "${SITE_URL}data/_runs.json?v=$(date +%s)" | python3 -c "import json,sys,datetime as d;R=json.load(sys.stdin);p=R.get('publish') or {};s=p.get('derivs_run_at');n=d.datetime.now(d.timezone.utc);print('derivs run',s,'| live verified',n.strftime('%FT%TZ'),'| end-to-end',round((n-d.datetime.fromisoformat(s.replace('Z','+00:00'))).total_seconds()/60,1) if s else '—','min')" | tee -a "$GITHUB_STEP_SUMMARY"

  rollback:
    # P1 (15 Oct): ONE Pages deploy at a time across ci.yml and publish-derivs.yml; a second deploy waits (never cancelled mid-deploy)
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: smoke
    if: failure() && needs.smoke.result == 'failure'
    runs-on: ubuntu-latest
    outputs:
      code_sha: ${{ steps.rb.outputs.code_sha }}
      data_updated: ${{ steps.rb.outputs.data_updated }}
    permissions:
      pages: write
      id-token: write
      actions: read
      contents: read
    environment:
      name: github-pages
    steps:
      - name: Last good deploy (newest successful CI and deploy or fast publish before this one)
        id: good
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(bash .github/scripts/last_good.sh)
          [ -n "$sha" ] || { echo "::error::no previous good deploy"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "rolling back to $sha"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.good.outputs.sha }}
      # rollback is the one deploy allowed to put older data back: the newer data just failed live smoke
      # code from refs/tags/pages-tested (fetched from main's scripts); data/ from the last good deploy commit
      - run: |
          git fetch -q origin main && git show FETCH_HEAD:.github/scripts/tested_sha.sh > "$RUNNER_TEMP/tested_sha.sh"; git fetch -q origin refs/tags/pages-tested:refs/tags/pages-tested || true
          code=$(GITHUB_REPOSITORY= bash "$RUNNER_TEMP/tested_sha.sh"); code=${code:-${{ steps.good.outputs.sha }}}; git fetch -q origin "$code" || true
          mkdir _site && git archive "$code" -- index.html manifest.webmanifest icons $(git cat-file -e "$code:sw.js" 2>/dev/null && echo sw.js) | tar -x -C _site && cp -r data _site/
          python3 -c "import json,sys;json.dump({'code_sha':sys.argv[1],'data_sha':sys.argv[2]},open('_site/build.json','w'))" "$code" "${{ steps.good.outputs.sha }}"
      - name: Publish guard on the exact derivs.json (no test marks, closed hours only, overlapping hours = main)
        run: |
          git fetch -q origin main && git show FETCH_HEAD:.github/scripts/publish_guard.py > "$RUNNER_TEMP/publish_guard.py" && git show FETCH_HEAD:data/derivs.json > "$RUNNER_TEMP/main-derivs.json"
          python3 "$RUNNER_TEMP/publish_guard.py" _site/data/derivs.json "$RUNNER_TEMP/main-derivs.json"
      - name: Record what the rollback restores (for rollback-alert)
        id: rb
        run: |
          echo "code_sha=$(python3 -c "import json;print(json.load(open('_site/build.json')).get('code_sha',''))" 2>/dev/null)" >> "$GITHUB_OUTPUT"
          echo "data_updated=$(python3 -c "import json;print(json.load(open('_site/data/derivs.json')).get('updated',''))" 2>/dev/null)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-rollback
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-rollback

  rollback-alert:
    # 16 Oct: every completed rollback restores older code/data -> a RED, clearly named job so the supervisor's red-run watch tells the room
    needs: rollback
    if: always() && needs.rollback.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: ROLLBACK HAPPENED - live restored to older code/data
        env:
          RB_CODE: ${{ needs.rollback.outputs.code_sha }}
          RB_DATA: ${{ needs.rollback.outputs.data_updated }}
        run: |
          msg="ROLLBACK in $GITHUB_WORKFLOW run $GITHUB_RUN_ID: live restored to code ${RB_CODE:-unknown}, derivs data updated ${RB_DATA:-unknown}. The rollback deploy completed; this job is red so the room is told."
          echo "::error title=ROLLBACK - live restored::$msg"; echo "### ROLLBACK - live restored" >> "$GITHUB_STEP_SUMMARY"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          exit 1
