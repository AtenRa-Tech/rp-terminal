name: Stale data alarm
# Runs on its own every 3h on the real clock (Netlify kicker is gone, 24 Oct), plus manual dispatch.
# FAILS (red, like live-lag) when live _runs.json shows any feed past its own limit, so the deploy-failure watch posts it to the room.
on:
  schedule:
    - cron: '47 */3 * * *'   # 8/day, real clock, limits from live _runs.json (OI/basis 5h, market 3h, funding 12h)
  workflow_dispatch:
    inputs:
      reason:
        description: why the alarm fired
        required: false
permissions:
  contents: read
concurrency:
  group: stale-alarm
  cancel-in-progress: false
jobs:
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Live data age per feed limit (fails when stale)
        run: |
          echo "alarm reason: ${{ inputs.reason }}"
          python3 .github/scripts/data_age.py "https://atenra-tech.github.io/rp-terminal/data/_runs.json"
