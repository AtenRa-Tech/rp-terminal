name: Stale data alarm
# Manual dispatch only (25 Oct): the scheduled alarm now runs as the stale-alarm job of every hourly data.yml run (no extra scheduled runs);
# live-suite.yml repeats the same check daily as a backstop if data.yml stops being scheduled.
# FAILS (red, like live-lag) when live _runs.json shows any feed past its own limit, so the deploy-failure watch posts it to the room.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: why the alarm fired
        required: false
permissions:
  contents: read
concurrency:
  group: stale-alarm
  cancel-in-progress: false
jobs:
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Live data age per feed limit (fails when stale)
        run: |
          echo "alarm reason: ${{ inputs.reason }}"
          python3 .github/scripts/data_age.py "https://atenra-tech.github.io/rp-terminal/data/_runs.json"
