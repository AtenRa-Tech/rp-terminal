name: CI and deploy

# Tests every push/PR to main, then deploys to GitHub Pages via Actions, then smoke-tests the live site
# and rolls back to the last good commit if the smoke test fails.
# NOTE: Pages must be switched to "GitHub Actions" as its source (Settings -> Pages -> Build and deployment),
# or: gh api -X PUT repos/AtenRa-Tech/rp-terminal/pages -f build_type=workflow
on:
  push:
    branches: [main]
    # data-only pushes (data.yml, deploy key) never start this workflow: data.yml dispatches the fast publish (publish guard + smoke) instead
    paths-ignore: ['data/**']
  pull_request:
    branches: [main]
  # merge queue (15 Oct ruling): only the test job runs on merge_group; deploy/smoke/live-lag/rollback skip it
  merge_group:
    types: [checks_requested]
  # Not workflow_run: GitHub creates no workflow_run event when "Refresh data" was itself started by GITHUB_TOKEN (the smoke fallback below),
  # so those data commits were never deployed. data.yml dispatches this workflow after every successful data push instead (workflow_dispatch
  # from GITHUB_TOKEN is allowed), whoever started the data run (schedule, person, or this workflow).
  workflow_dispatch:
    inputs:
      data_redeploy:
        description: 'Data-only redeploy (skip the long node suites and the stale-data fallback)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.ref || 'main' }}
  cancel-in-progress: false

env:
  SITE_URL: https://atenra-tech.github.io/rp-terminal/
  NODE_PATH: ${{ github.workspace }}/tests/node_modules

jobs:
  test:
    # the ruleset's required check: it ALWAYS runs and reports (never path-filtered at workflow level), so data-only PRs are never stuck.
    # 21 Oct (slow schedule): a change that touches ONLY data/ runs the publish guard + a local smoke test; anything else runs the full suite.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope - data-only change (only data/ differs from the base) or code change (full suite)
        id: scope
        env:
          EV: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EV" in pull_request) base="$PR_BASE";; merge_group) base="$MQ_BASE";; *) base="";; esac
          full=true
          if [ -n "$base" ]; then
            # fail closed: if the diff cannot be computed, run the full suite
            if files=$(git diff --no-renames --name-only "$base" HEAD); then
              bad=$(printf '%s\n' "$files" | grep -v -e '^data/' -e '^$' || true)
              if [ -n "$files" ] && [ -z "$bad" ]; then full=false; fi
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"; echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "event=$EV base=${base:-none} -> full suite=$full"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scan - no India / INR / rupee / en-IN anywhere in the app
        run: |
          # case-sensitive on purpose: the app's own filters (lowercase india/inr regexes that drop such news items and clear old keys) are allowed
          if grep -nE 'en-IN|\bINR\b|₹|\bIndia|\bRupee' index.html sw.js manifest.webmanifest; then echo "::error::India/INR content found"; exit 1; fi
          if [ -e india.json ] || [ -e data/india.json ]; then echo "::error::india.json must not exist"; exit 1; fi
      - name: Install test deps
        run: cd tests && npm install --no-audit --no-fund
      - name: Serve the site locally
        run: |
          mkdir -p "$RUNNER_TEMP/gates"
          python3 -m http.server 8765 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8765/index.html >/dev/null && break; sleep 1; done
      - name: Data-only change - publish guard on data/derivs.json vs the base (blocking)
        if: steps.scope.outputs.full == 'false'
        run: |
          git show "${{ steps.scope.outputs.base }}:data/derivs.json" > "$RUNNER_TEMP/base-derivs.json"
          python3 .github/scripts/publish_guard.py data/derivs.json "$RUNNER_TEMP/base-derivs.json"
          python3 tests/tclosed_hours.py
      - name: Data-only change - local smoke test (every tab renders, no errors) + card presence (blocking)
        if: steps.scope.outputs.full == 'false'
        run: |
          set -e
          node tests/tsmoke.js http://localhost:8765/
          node qa/card-presence.js http://localhost:8765/index.html
      - name: Node test suites (headless Chrome; skipped on hourly data redeploys to save minutes)
        if: ${{ steps.scope.outputs.full == 'true' && (!inputs.data_redeploy) }}
        run: set -o pipefail; tests/run-all.sh 2>&1 | tee "$RUNNER_TEMP/gates/node-suites.log"
      - name: Known-answer tests (frozen 30 Sep 2026 snapshot, data-golden.json)
        if: steps.scope.outputs.full == 'true'
        run: set -o pipefail; GOLD=tests/fixtures node tests/tgolden.js 2>&1 | tee "$RUNNER_TEMP/gates/known-answer.log"
      - name: Caption sweep gate (blocking)
        if: steps.scope.outputs.full == 'true'
        run: set -o pipefail; node qa/caption-sweep.js http://localhost:8765/index.html 2>&1 | tee "$RUNNER_TEMP/gates/caption-sweep.log"
      - name: Pulse movers gate (blocking; 5 fixtures + history fixture, movers and heatmap, Crypto News GOD's qa/pulse-movers.js)
        if: steps.scope.outputs.full == 'true'
        run: set -o pipefail; node qa/pulse-movers.js http://localhost:8765/index.html 2>&1 | tee "$RUNNER_TEMP/gates/pulse-movers.log"
      - name: OI ÷ supply label gate (blocking; Crypto News GOD's qa/oicap-label.js, unchanged)
        if: steps.scope.outputs.full == 'true'
        run: set -o pipefail; node qa/oicap-label.js http://localhost:8765/index.html 2>&1 | tee "$RUNNER_TEMP/gates/oicap-label.log"
      - name: Card presence gate (blocking; Crypto News GOD's qa/card-presence.js, unchanged) - every known card is in SIG or SIGSTALE with stale:true + staleWhy
        if: steps.scope.outputs.full == 'true'
        run: set -o pipefail; node qa/card-presence.js http://localhost:8765/index.html 2>&1 | tee "$RUNNER_TEMP/gates/card-presence.log"
      - name: Sell-off lint gate (blocking; 13 sentences through the app's lintBanned(), qa/selloff-lint.js unchanged)
        if: steps.scope.outputs.full == 'true'
        run: set -o pipefail; node qa/selloff-lint.js http://localhost:8765/index.html 2>&1 | tee "$RUNNER_TEMP/gates/selloff-lint.log"
      - name: Export check gate (blocking, built files; 29 exports need @RPTIME, Data source + as-of, UTC time, no lean words)
        if: steps.scope.outputs.full == 'true'
        working-directory: ${{ runner.temp }}
        # one retry after 90 s only to ride out a CoinGecko/CoinPaprika rate limit; any second failure blocks
        run: set -o pipefail; { node "$GITHUB_WORKSPACE/qa/export-check.js" http://localhost:8765/index.html || { sleep 90; node "$GITHUB_WORKSPACE/qa/export-check.js" http://localhost:8765/index.html; }; } 2>&1 | tee "$RUNNER_TEMP/gates/export-check.log"
      - name: Derivatives run log (blocking) - _runs.json freshness per feed, 24h hourly sample, 95% SLA logic
        if: steps.scope.outputs.full == 'true'
        run: python3 tests/truns.py
      - name: Market + macro freshness in _runs.json (blocking)
        if: steps.scope.outputs.full == 'true'
        run: python3 tests/tmktfresh.py
      - name: OI/basis 5h limit from the hour start, 2h settle, missed-run + OKX-revision cases (blocking)
        run: python3 tests/tlim5.py
      - name: Fast publish path selection + no-regress (blocking)
        if: steps.scope.outputs.full == 'true'
        run: python3 -c 'import yaml' 2>/dev/null || pip install -q pyyaml; python3 tests/tpublish.py
      - name: Live data watchdog on seed/missing _runs.json (blocking)
        if: steps.scope.outputs.full == 'true'
        run: python3 tests/tlivelag.py
      - name: Confidence full inside each input's freshness limit, reduced only past it (blocking)
        if: steps.scope.outputs.full == 'true'
        run: node qa/conf-limit.js http://localhost:8765/index.html
      - name: Live price never changes a score (blocking) - agreeing, late (3% off) and missing live BTC give identical scores + data confidence
        if: steps.scope.outputs.full == 'true'
        run: node qa/live-price-score.js http://localhost:8765/index.html
      - name: Stale alarm / live data age per feed limit (blocking) - stale fails, fresh passes
        if: steps.scope.outputs.full == 'true'
        run: python3 tests/tdata_age.py
      - name: Pages deploys share ONE group (blocking) - static check over every deploying workflow
        if: steps.scope.outputs.full == 'true'
        run: python3 -c 'import yaml' 2>/dev/null || pip install -q pyyaml; python3 tests/tpages.py
      - name: Three deploys at once (blocking) - live ends on newest tested code + newest data; untested code never ships via a data publish
        if: steps.scope.outputs.full == 'true'
        run: python3 tests/tpages_sim.py
      - name: Slow schedule (blocking) - no cron more often than hourly, data jobs never overlap, test check always reports
        if: steps.scope.outputs.full == 'true'
        run: python3 -c 'import yaml' 2>/dev/null || pip install -q pyyaml; python3 tests/tschedule.py
      - name: Deploy proof (blocking) - every data deploy runs the publish guard; a data push ships only pages-tested code
        if: steps.scope.outputs.full == 'true'
        run: python3 tests/tdeploy_proof.py
      - name: Closed hours only (blocking) - OI/basis store only CLOSED hours; fails if the last stored hour has not closed
        if: steps.scope.outputs.full == 'true'
        run: python3 tests/tclosed_hours.py
      - name: Fixture consistency (blocking) - no derivs fixture has a latest timestamp newer than its own series beyond the metric limit
        if: steps.scope.outputs.full == 'true'
        run: set -o pipefail; node qa/fixture-consistency.js 2>&1 | tee "$RUNNER_TEMP/gates/fixture-consistency.log"
      - name: Stale-data gate (blocking) - a metric past its freshness limit gives no reading anywhere (team tests + boundary/mixed/scores/confidence)
        if: steps.scope.outputs.full == 'true'
        run: |
          set -eo pipefail
          { node qa/stale-derivs.js http://localhost:8765/index.html
            DERIVS_FIXTURE=qa/fixtures/derivs-stale.json node qa/stale-captions.js http://localhost:8765/index.html
            node qa/stale-derivs2.js http://localhost:8765/index.html
            node qa/stale-conf.js http://localhost:8765/index.html; } 2>&1 | tee "$RUNNER_TEMP/gates/stale-data.log"
      - name: News replay diff (report only)
        if: steps.scope.outputs.full == 'true'
        continue-on-error: true
        timeout-minutes: 5   # report-only: a hang here must never eat the 45-min job budget (15 Oct: a820abc CI stuck here)
        run: node qa/news-replay.js run http://localhost:8765/index.html
      - name: Watchdog - failing gate lines to the job summary as ::error
        if: failure()
        env:
          DATA_REDEPLOY: ${{ inputs.data_redeploy }}
        run: bash .github/scripts/gate-summary.sh "${{ inputs.data_redeploy && 'Data redeploy test' || 'Test' }}"

  deploy:
    # P1 (15 Oct): ONE Pages deploy at a time across ci.yml and data.yml; a second deploy waits (never cancelled mid-deploy)
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: test
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # P1 (15 Oct): every deploy = code from a TESTED commit + newest data/ on main (.github/scripts/snapshot.sh). This run's own commit passed
      # `test` above; a data-only redeploy (suites skipped) ships the code of refs/tags/pages-tested (last commit green on test AND live smoke), never main HEAD's code.
      - name: Snapshot (tested code + newest data/ from main); refuse if code or data older than live
        env:
          DATA_REDEPLOY: ${{ inputs.data_redeploy }}
        run: |
          python3 .github/scripts/no_regress.py snapshot live-before.json
          if [ "$DATA_REDEPLOY" = true ]; then code=$(bash .github/scripts/tested_sha.sh); else code="$GITHUB_SHA"; fi
          bash .github/scripts/snapshot.sh _site "$code"
      - uses: actions/upload-artifact@v4
        with:
          name: live-before
          path: live-before.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dep
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to move refs/tags/pages-tested after a green live smoke
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd tests && npm install --no-audit --no-fund
      - name: Wait for Pages CDN
        run: sleep 60
      - uses: actions/download-artifact@v4
        with:
          name: live-before
      - name: Live derivatives never go backwards (failure rolls back)
        run: python3 .github/scripts/no_regress.py after live-before.json
      - name: Smoke test the live site
        run: mkdir -p "$RUNNER_TEMP/gates"; set -o pipefail; node tests/tsmoke.js "$SITE_URL" 2>&1 | tee "$RUNNER_TEMP/gates/smoke.log"
      - name: Export check on the live site (failure rolls back)
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/qa/export-check.js" "$SITE_URL" || { sleep 90; node "$GITHUB_WORKSPACE/qa/export-check.js" "$SITE_URL"; }
      - name: Pulse movers on the live site (failure rolls back)
        run: node qa/pulse-movers.js "$SITE_URL"
      - name: OI ÷ supply label on the live site (failure rolls back)
        run: node qa/oicap-label.js "$SITE_URL"
      - name: Card presence on the live site (failure rolls back; Crypto News GOD's qa/card-presence.js unchanged)
        run: node qa/card-presence.js "$SITE_URL"
      - name: Sell-off lint on the live site (failure rolls back)
        run: node qa/selloff-lint.js "$SITE_URL"
      - name: Stale-data gate on the live site (blocking; failure rolls back)
        run: |
          set -e
          node qa/stale-derivs.js "$SITE_URL"
          DERIVS_FIXTURE=qa/fixtures/derivs-stale.json node qa/stale-captions.js "$SITE_URL"
          # interim (supervisor 15 Oct): S1 reports only on the LIVE gate until #29's score fix is live; S2-S6 still block; S1 still blocks in the test job
          S1_REPORT_ONLY=1 node qa/stale-derivs2.js "$SITE_URL"
          node qa/stale-conf.js "$SITE_URL"
      - name: Axis label minimum on the live site (blocking; failure rolls back)
        run: URL="$SITE_URL" node tests/tqa6.js
      - name: Range buttons, indicators and stated ranges on the live site (blocking; failure rolls back)
        run: URL="$SITE_URL" node tests/trange.js
      - name: Data job fallback - dispatch ONE "Refresh data" when _runs.json says derivatives are past their 3h limit or a feed is stale (GitHub cron is best-effort)
        # not on data redeploys (no self-trigger loop); 21 Oct: only when NO data run is already queued/running, at most one dispatch per CI run
        if: always() && !inputs.data_redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # freshness from data/_runs.json (per-feed timestamps from the last data run), not derivs.json 'updated'
          j=$(curl -s "${SITE_URL}data/_runs.json?v=$(date +%s)")
          last=$(printf '%s' "$j" | python3 -c "import json,sys,datetime as d;R=json.load(sys.stdin);print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(R['last_run'].replace('Z','+00:00'))).total_seconds()//3600))" 2>/dev/null || echo 999)
          bad=$(printf '%s' "$j" | python3 -c "import json,sys;R=json.load(sys.stdin);print(sum(1 for v in R['runs'][-1]['feeds'].values() if not v['ok']))" 2>/dev/null || echo 99)
          echo "last data run ${last}h ago; feeds past their limit in that run: ${bad}"
          if [ "$last" -ge 3 ] || [ "$bad" -gt 0 ]; then
            busy=$(gh run list --repo "$GITHUB_REPOSITORY" -w data.yml -L 5 --json status -q '[.[]|select(.status!="completed")]|length' || echo 1)
            if [ "${busy:-1}" -gt 0 ]; then echo "a data run is already queued/running ($busy): no dispatch"; exit 0; fi
            full=false; [ "$last" -ge 26 ] && full=true
            gh workflow run data.yml --repo "$GITHUB_REPOSITORY" -f full=$full && echo "dispatched Refresh data (full=$full)"
          fi
      - name: Promote tested code (refs/tags/pages-tested) - live serves this commit's code and every smoke gate passed
        if: success() && inputs.data_redeploy != true
        run: |
          lc=$(curl -sf "${SITE_URL}build.json?v=$(date +%s)" | python3 -c "import json,sys;print(json.load(sys.stdin)['code_sha'])" || true)
          [ "$lc" = "$GITHUB_SHA" ] || { echo "live code is ${lc:-unknown}, not $GITHUB_SHA: tag not moved"; exit 0; }
          git fetch -q origin main --tags || true; cur=$(git rev-parse -q --verify refs/tags/pages-tested || true)
          if [ -n "$cur" ] && ! git merge-base --is-ancestor "$cur" "$GITHUB_SHA"; then echo "pages-tested $cur is not an ancestor of $GITHUB_SHA: not moved"; exit 0; fi
          git push -f origin "$GITHUB_SHA:refs/tags/pages-tested" && echo "pages-tested -> $GITHUB_SHA"
      - name: Watchdog - failing smoke lines to the job summary as ::error
        if: failure()
        env:
          DATA_REDEPLOY: ${{ inputs.data_redeploy }}
        run: bash .github/scripts/gate-summary.sh "Live smoke (rolled back)"

  live-lag:
    # Watchdog item 3: runs after every main CI run, green or not; red with ::error when the live derivs.json is 6h+ behind main
    needs: [test, smoke]
    if: always() && github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live data watchdog (fails loudly if live derivs.json is more than 6h behind main)
        run: python3 .github/scripts/live-lag.py
      - name: Derivatives SLA alarm (fails loudly unless derivatives were within limits in >= 95% of hourly samples over 24h; reads data/_runs.json on the live site)
        # runs even when the watchdog step above fails, so the alarm is never skipped
        if: always()
        run: |
          curl -sf "${SITE_URL:-https://atenra-tech.github.io/rp-terminal/}data/_runs.json?v=$(date +%s)" -o /tmp/runs-live.json || cp data/_runs.json /tmp/runs-live.json
          python3 scripts/runs_log.py --check 95 /tmp/runs-live.json

  rollback:
    # P1 (15 Oct): ONE Pages deploy at a time across ci.yml and data.yml; a second deploy waits (never cancelled mid-deploy)
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: smoke
    if: failure() && needs.smoke.result == 'failure' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    outputs:
      code_sha: ${{ steps.rb.outputs.code_sha }}
      data_updated: ${{ steps.rb.outputs.data_updated }}
    permissions:
      pages: write
      id-token: write
      actions: read
      contents: read
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # rollback restores CODE only, to refs/tags/pages-tested (last commit green on test AND live smoke); data/ = newest of main HEAD and live
      - name: Snapshot of the last tested code + newest data (never backwards)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(bash .github/scripts/tested_sha.sh); [ -n "$sha" ] || { echo "::error::no tested commit"; exit 1; }
          echo "rolling back code to $sha"; bash .github/scripts/snapshot.sh _site "$sha" --rollback
      - name: Record what the rollback restores (for rollback-alert)
        id: rb
        run: |
          echo "code_sha=$(python3 -c "import json;print(json.load(open('_site/build.json')).get('code_sha',''))" 2>/dev/null)" >> "$GITHUB_OUTPUT"
          echo "data_updated=$(python3 -c "import json;print(json.load(open('_site/data/derivs.json')).get('updated',''))" 2>/dev/null)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      # own artifact name: the deploy job of this same run already uploaded "github-pages", and deploy-pages refuses when two share a name
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-rollback
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-rollback

  rollback-alert:
    # 16 Oct: every completed rollback restores older code/data -> a RED, clearly named job so the supervisor's red-run watch tells the room
    needs: rollback
    if: always() && needs.rollback.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: ROLLBACK HAPPENED - live restored to older code/data
        env:
          RB_CODE: ${{ needs.rollback.outputs.code_sha }}
          RB_DATA: ${{ needs.rollback.outputs.data_updated }}
        run: |
          msg="ROLLBACK in $GITHUB_WORKFLOW run $GITHUB_RUN_ID: live restored to code ${RB_CODE:-unknown}, derivs data updated ${RB_DATA:-unknown}. The rollback deploy completed; this job is red so the room is told."
          echo "::error title=ROLLBACK - live restored::$msg"; echo "### ROLLBACK - live restored" >> "$GITHUB_STEP_SUMMARY"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          exit 1
