name: CI and deploy

# Tests every push/PR to main, then deploys to GitHub Pages via Actions, then smoke-tests the live site
# and rolls back to the last good commit if the smoke test fails.
# NOTE: Pages must be switched to "GitHub Actions" as its source (Settings -> Pages -> Build and deployment),
# or: gh api -X PUT repos/AtenRa-Tech/rp-terminal/pages -f build_type=workflow
on:
  push:
    branches: [main]
    # data-only commits (the data job, pushed with its deploy key) are redeployed by data.yml dispatching this workflow with data_redeploy=true
    paths-ignore: ['data/**']
  pull_request:
    branches: [main]
  # Not workflow_run: GitHub creates no workflow_run event when "Refresh data" was itself started by GITHUB_TOKEN (the smoke fallback below),
  # so those data commits were never deployed. data.yml dispatches this workflow after every successful data push instead (workflow_dispatch
  # from GITHUB_TOKEN is allowed), whoever started the data run (schedule, person, or this workflow).
  workflow_dispatch:
    inputs:
      data_redeploy:
        description: 'Data-only redeploy (skip the long node suites and the stale-data fallback)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  SITE_URL: https://atenra-tech.github.io/rp-terminal/
  NODE_PATH: ${{ github.workspace }}/tests/node_modules

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scan - no India / INR / rupee / en-IN anywhere in the app
        run: |
          # case-sensitive on purpose: the app's own filters (lowercase india/inr regexes that drop such news items and clear old keys) are allowed
          if grep -nE 'en-IN|\bINR\b|₹|\bIndia|\bRupee' index.html sw.js manifest.webmanifest; then echo "::error::India/INR content found"; exit 1; fi
          if [ -e india.json ] || [ -e data/india.json ]; then echo "::error::india.json must not exist"; exit 1; fi
      - name: Install test deps
        run: cd tests && npm install --no-audit --no-fund
      - name: Serve the site locally
        run: |
          mkdir -p "$RUNNER_TEMP/gates"
          python3 -m http.server 8765 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8765/index.html >/dev/null && break; sleep 1; done
      - name: Node test suites (headless Chrome; skipped on hourly data redeploys to save minutes)
        if: ${{ !inputs.data_redeploy }}
        run: set -o pipefail; tests/run-all.sh 2>&1 | tee "$RUNNER_TEMP/gates/node-suites.log"
      - name: Known-answer tests (frozen 30 Sep 2026 snapshot, data-golden.json)
        run: set -o pipefail; GOLD=tests/fixtures node tests/tgolden.js 2>&1 | tee "$RUNNER_TEMP/gates/known-answer.log"
      - name: Caption sweep gate (blocking)
        run: set -o pipefail; node qa/caption-sweep.js http://localhost:8765/index.html 2>&1 | tee "$RUNNER_TEMP/gates/caption-sweep.log"
      - name: Pulse movers gate (blocking; 5 fixtures + history fixture, movers and heatmap, Crypto News GOD's qa/pulse-movers.js)
        run: set -o pipefail; node qa/pulse-movers.js http://localhost:8765/index.html 2>&1 | tee "$RUNNER_TEMP/gates/pulse-movers.log"
      - name: OI ÷ supply label gate (blocking; Crypto News GOD's qa/oicap-label.js, unchanged)
        run: set -o pipefail; node qa/oicap-label.js http://localhost:8765/index.html 2>&1 | tee "$RUNNER_TEMP/gates/oicap-label.log"
      - name: Card presence gate (blocking; Crypto News GOD's qa/card-presence.js, unchanged) - every known card is in SIG or SIGSTALE with stale:true + staleWhy
        run: set -o pipefail; node qa/card-presence.js http://localhost:8765/index.html 2>&1 | tee "$RUNNER_TEMP/gates/card-presence.log"
      - name: Sell-off lint gate (blocking; 13 sentences through the app's lintBanned(), qa/selloff-lint.js unchanged)
        run: set -o pipefail; node qa/selloff-lint.js http://localhost:8765/index.html 2>&1 | tee "$RUNNER_TEMP/gates/selloff-lint.log"
      - name: Export check gate (blocking, built files; 29 exports need @RPTIME, Data source + as-of, UTC time, no lean words)
        working-directory: ${{ runner.temp }}
        # one retry after 90 s only to ride out a CoinGecko/CoinPaprika rate limit; any second failure blocks
        run: set -o pipefail; { node "$GITHUB_WORKSPACE/qa/export-check.js" http://localhost:8765/index.html || { sleep 90; node "$GITHUB_WORKSPACE/qa/export-check.js" http://localhost:8765/index.html; }; } 2>&1 | tee "$RUNNER_TEMP/gates/export-check.log"
      - name: Derivatives run log (blocking) - _runs.json freshness per feed, 24h hourly sample, 95% SLA logic
        run: python3 tests/truns.py
      - name: Market + macro freshness in _runs.json (blocking)
        run: python3 tests/tmktfresh.py
      - name: Fast publish path selection + no-regress (blocking)
        run: python3 -c 'import yaml' 2>/dev/null || pip install -q pyyaml; python3 tests/tpublish.py
      - name: Live data watchdog on seed/missing _runs.json (blocking)
        run: python3 tests/tlivelag.py
      - name: Stale alarm / live data age per feed limit (blocking) - stale fails, fresh passes
        run: python3 tests/tdata_age.py
      - name: Closed hours only (blocking) - OI/basis store only CLOSED hours; fails if the last stored hour has not closed
        run: python3 tests/tclosed_hours.py
      - name: Fixture consistency (blocking) - no derivs fixture has a latest timestamp newer than its own series beyond the metric limit
        run: set -o pipefail; node qa/fixture-consistency.js 2>&1 | tee "$RUNNER_TEMP/gates/fixture-consistency.log"
      - name: Stale-data gate (blocking) - a metric past its freshness limit gives no reading anywhere (team tests + boundary/mixed/scores/confidence)
        run: |
          set -eo pipefail
          { node qa/stale-derivs.js http://localhost:8765/index.html
            DERIVS_FIXTURE=qa/fixtures/derivs-stale.json node qa/stale-captions.js http://localhost:8765/index.html
            node qa/stale-derivs2.js http://localhost:8765/index.html
            node qa/stale-conf.js http://localhost:8765/index.html; } 2>&1 | tee "$RUNNER_TEMP/gates/stale-data.log"
      - name: News replay diff (report only)
        continue-on-error: true
        timeout-minutes: 5   # report-only: a hang here must never eat the 45-min job budget (15 Oct: a820abc CI stuck here)
        run: node qa/news-replay.js run http://localhost:8765/index.html
      - name: Watchdog - failing gate lines to the job summary as ::error
        if: failure()
        env:
          DATA_REDEPLOY: ${{ inputs.data_redeploy }}
        run: bash .github/scripts/gate-summary.sh "${{ inputs.data_redeploy && 'Data redeploy test' || 'Test' }}"

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder (app only, no tests)
        run: mkdir _site && cp -r index.html sw.js manifest.webmanifest icons data _site/ && cp README.md _site/ 2>/dev/null || true
      - name: Newest derivs from main HEAD at deploy time; refuse to publish if older than live
        run: |
          python3 .github/scripts/no_regress.py snapshot live-before.json
          bash .github/scripts/newest_data.sh _site
      - uses: actions/upload-artifact@v4
        with:
          name: live-before
          path: live-before.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dep
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd tests && npm install --no-audit --no-fund
      - name: Wait for Pages CDN
        run: sleep 60
      - uses: actions/download-artifact@v4
        with:
          name: live-before
      - name: Live derivatives never go backwards (failure rolls back)
        run: python3 .github/scripts/no_regress.py after live-before.json
      - name: Smoke test the live site
        run: mkdir -p "$RUNNER_TEMP/gates"; set -o pipefail; node tests/tsmoke.js "$SITE_URL" 2>&1 | tee "$RUNNER_TEMP/gates/smoke.log"
      - name: Export check on the live site (failure rolls back)
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/qa/export-check.js" "$SITE_URL" || { sleep 90; node "$GITHUB_WORKSPACE/qa/export-check.js" "$SITE_URL"; }
      - name: Pulse movers on the live site (failure rolls back)
        run: node qa/pulse-movers.js "$SITE_URL"
      - name: OI ÷ supply label on the live site (failure rolls back)
        run: node qa/oicap-label.js "$SITE_URL"
      - name: Card presence on the live site (failure rolls back; Crypto News GOD's qa/card-presence.js unchanged)
        run: node qa/card-presence.js "$SITE_URL"
      - name: Sell-off lint on the live site (failure rolls back)
        run: node qa/selloff-lint.js "$SITE_URL"
      - name: Stale-data gate on the live site (blocking; failure rolls back)
        run: |
          set -e
          node qa/stale-derivs.js "$SITE_URL"
          DERIVS_FIXTURE=qa/fixtures/derivs-stale.json node qa/stale-captions.js "$SITE_URL"
          node qa/stale-derivs2.js "$SITE_URL"
          node qa/stale-conf.js "$SITE_URL"
      - name: Axis label minimum on the live site (blocking; failure rolls back)
        run: URL="$SITE_URL" node tests/tqa6.js
      - name: Range buttons, indicators and stated ranges on the live site (blocking; failure rolls back)
        run: URL="$SITE_URL" node tests/trange.js
      - name: Data job fallback - dispatch "Refresh derivatives" (and "Refresh data") when _runs.json says a run is late or a feed is stale (GitHub cron is best-effort)
        # not on data redeploys: a data run that could not refresh derivs.json must not re-trigger itself in a loop
        if: always() && !inputs.data_redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # freshness from data/_runs.json (per-feed timestamps from the last derivatives run), not derivs.json 'updated'
          j=$(curl -s "${SITE_URL}data/_runs.json?v=$(date +%s)")
          last=$(printf '%s' "$j" | python3 -c "import json,sys,datetime as d;R=json.load(sys.stdin);print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(R['last_run'].replace('Z','+00:00'))).total_seconds()//3600))" 2>/dev/null || echo 999)
          bad=$(printf '%s' "$j" | python3 -c "import json,sys;R=json.load(sys.stdin);print(sum(1 for v in R['runs'][-1]['feeds'].values() if not v['ok']))" 2>/dev/null || echo 99)
          echo "last derivatives run ${last}h ago; feeds past their limit in that run: ${bad}"
          if [ "$last" -ge 1 ] || [ "$bad" -gt 0 ]; then gh workflow run derivs.yml --repo "$GITHUB_REPOSITORY" && echo "dispatched Refresh derivatives"; fi
          if [ "$last" -ge 7 ]; then gh workflow run data.yml --repo "$GITHUB_REPOSITORY" -f full=true && echo "dispatched Refresh data"; fi
      - name: Watchdog - failing smoke lines to the job summary as ::error
        if: failure()
        env:
          DATA_REDEPLOY: ${{ inputs.data_redeploy }}
        run: bash .github/scripts/gate-summary.sh "Live smoke (rolled back)"

  live-lag:
    # Watchdog item 3: runs after every main CI run, green or not; red with ::error when the live derivs.json is 6h+ behind main
    needs: [test, smoke]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live data watchdog (fails loudly if live derivs.json is more than 6h behind main)
        run: python3 .github/scripts/live-lag.py
      - name: Derivatives SLA alarm (fails loudly unless derivatives were within limits in >= 95% of hourly samples over 24h; reads data/_runs.json on the live site)
        # runs even when the watchdog step above fails, so the alarm is never skipped
        if: always()
        run: |
          curl -sf "${SITE_URL:-https://atenra-tech.github.io/rp-terminal/}data/_runs.json?v=$(date +%s)" -o /tmp/runs-live.json || cp data/_runs.json /tmp/runs-live.json
          python3 scripts/runs_log.py --check 95 /tmp/runs-live.json

  rollback:
    needs: smoke
    if: failure() && needs.smoke.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
      contents: read
    environment:
      name: github-pages
    steps:
      - name: Find the last commit whose CI run succeeded
        id: good
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success -L 1 --json headSha -q '.[0].headSha')
          [ -n "$sha" ] || { echo "::error::no previous good commit"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "rolling back to $sha"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.good.outputs.sha }}
      # rollback restores CODE only: data/ = newest of main HEAD and live (never backwards), checked before deploy
      - run: mkdir _site && cp -r index.html manifest.webmanifest icons data _site/ && (cp sw.js _site/ 2>/dev/null || true)
      - name: Newest data (main HEAD or live, whichever is newer) + never-backwards check
        # scripts come from main HEAD: the last good commit may predate them
        run: |
          git fetch -q origin main && mkdir -p "$RUNNER_TEMP/rb" && for f in rollback_data.sh no_regress.py publish_guard.py; do git show "FETCH_HEAD:.github/scripts/$f" > "$RUNNER_TEMP/rb/$f"; done
          bash "$RUNNER_TEMP/rb/rollback_data.sh" _site
      - uses: actions/configure-pages@v5
      # own artifact name: the deploy job of this same run already uploaded "github-pages", and deploy-pages refuses when two share a name
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-rollback
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-rollback
