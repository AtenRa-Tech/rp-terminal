name: Refresh data

# 21 Oct (account suspended for excessive automation): ONE data workflow on a slow schedule.
#  - HOURLY at :17 (off the :00 peak): derivatives (OI, funding, basis) + market in ONE run, ONE commit, ONE push, ONE fast publish.
#    derivs.yml no longer has a schedule (manual fallback only); the old 4x-an-hour crons on data.yml and derivs.yml are gone.
#  - DAILY batch at 00:20 UTC (after the 00:00 UTC daily closes): macro (FRED) + ETF flows, plus the hourly set.
#    BTC history and ETH/BTC have no server-side job: the app reads them from the exchanges in the browser (Coinbase/Binance), so
#    they follow the 00:00 UTC close on their own. Weekly Thursday 21:00 UTC for the Fed H.4.1 release (WALCL/WDTGAL).
#  Freshness limits are unchanged (market 2h, OI/basis 3h). GitHub runs crons best-effort; a dropped hour shows as stale in the app,
#  and ci.yml's smoke fallback dispatches at most one extra run (only when none is queued/running).
on:
  schedule:
    - cron: '17 * * * *'    # hourly: derivs + market
    - cron: '20 0 * * *'    # daily batch: macro + ETF (+ hourly set)
    - cron: '0 21 * * 4'    # weekly: Fed H.4.1 (macro)
  workflow_dispatch:
    inputs:
      full:
        description: 'Also run the daily macro + ETF batch'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # dispatch "Fast publish" after a data push

# one data run at a time, never cancelled mid-push; GitHub keeps at most ONE pending run in a group (a newer pending replaces the older),
# so dropped/late crons or extra dispatches can never pile up into overlapping runs. derivs.yml shares this group.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pushes go over SSH with the repo's write deploy key (secret DATA_DEPLOY_KEY). The main-branch ruleset requires the "test" check
      # and lets only deploy keys bypass it, so this job can keep committing data (hourly + daily batch); the guard below makes sure that key can only ever change data/.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}

      - name: Record the commit this run starts from (guard baseline)
        run: echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide which jobs run
        id: plan
        run: |
          H=$(date -u +%H); M=$(date -u +%M); DOW=$(date -u +%u)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FULL="${{ inputs.full }}"
          elif [ "${{ github.event.schedule }}" = "20 0 * * *" ] || [ "${{ github.event.schedule }}" = "0 21 * * 4" ]; then
            FULL=true
          elif [ "$(python3 -c "import json,datetime as d;u=min((lambda j:j.get('checked_at') or j['updated'])(json.load(open('data/'+f))) for f in ('macro.json','etf.json'));print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(u.replace('Z','+00:00'))).total_seconds()//3600))" 2>/dev/null || echo 99)" -ge 26 ]; then
            FULL=true   # the daily batch was dropped or failed: the next hourly run picks it up once (checked_at = fetch time)
          else
            FULL=false
          fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "UTC $H:$M (dow $DOW, schedule '${{ github.event.schedule }}') -> daily batch=$FULL"

      - name: Derivatives OI / funding / basis (hourly)
        continue-on-error: true
        run: python scripts/fetch_derivs.py

      - name: Market breadth, dominance, TOTAL2/3 (hourly)
        continue-on-error: true
        run: python scripts/fetch_market.py

      - name: Macro data (daily batch; daily FRED series re-pulled in full each run)
        if: steps.plan.outputs.full == 'true'
        continue-on-error: true
        run: python scripts/fetch_macro.py

      - name: ETF flows (daily batch)
        if: steps.plan.outputs.full == 'true'
        continue-on-error: true
        run: python scripts/fetch_etf.py

      - name: Record this run in data/_runs.json (run time, per-feed freshness, rolling 24h hourly sample)
        if: always()
        run: python scripts/runs_log.py

      - name: Validate JSON before commit
        run: |
          for f in data/*.json; do python -c "import json,sys; json.load(open('$f'))" || { echo "invalid $f, restoring"; git checkout -- "$f"; }; done
          rm -f data/*.tmp

      - name: Commit if changed
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -q -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Guard - the data job may only change files under data/
        id: guard
        if: always() && steps.commit.outputs.changed == 'true'
        run: |
          # fail closed: any diff error blocks the push; --no-renames so a file moved into data/ also lists its old (non-data) path
          files=$(git diff --no-renames --name-only "$BASE" HEAD) || { echo "::error::guard could not diff $BASE..HEAD"; exit 1; }
          bad=$(printf '%s\n' "$files" | grep -v -e '^data/' -e '^$' || true)
          if [ -n "$bad" ]; then echo "::error::refusing to push: this job may only change data/, but its commit touches: $(echo $bad)"; exit 1; fi
          echo "guard ok, changed files:"; printf '%s\n' "$files"

      - name: Push (SSH deploy key; guard re-checked on every attempt)
        id: push
        if: always() && steps.commit.outputs.changed == 'true' && steps.guard.outcome == 'success'
        run: |
          # No merge/rebase: a queued run starts from an older commit and its data files conflict with the newer data commit.
          # Instead, start each attempt from the current origin/main and re-apply only the data files this run changed (whole files).
          mine=$(git rev-parse HEAD); msg=$(git log -1 --format=%s "$mine")
          changed=$(git diff --no-renames --name-only "$BASE" "$mine") || { echo "::error::could not list changed files"; exit 1; }
          for i in 1 2 3; do   # bounded: 3 attempts, then the job fails red (no re-dispatch, no retry storm)
            if git fetch -q origin main; then
              git reset -q --hard FETCH_HEAD
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                if git cat-file -e "$mine:$f" 2>/dev/null; then git checkout -q "$mine" -- "$f"; else git rm -q --ignore-unmatch -- "$f"; fi
              done <<< "$changed"
              git add -A -- data/
              if git diff --cached --quiet; then echo "main already has this data, nothing to push"; exit 0; fi
              git commit -q -m "$msg"
              git merge-base --is-ancestor FETCH_HEAD HEAD || { echo "::error::HEAD is not on top of main"; exit 1; }
              files=$(git diff --no-renames --name-only FETCH_HEAD HEAD) || { echo "::error::guard could not diff against main"; exit 1; }
              bad=$(printf '%s\n' "$files" | grep -v -e '^data/' -e '^$' || true)
              if [ -n "$bad" ]; then echo "::error::refusing to push: non-data paths $(echo $bad)"; exit 1; fi
              git push -q origin HEAD:main && { echo "pushed $(git rev-parse --short HEAD): $(echo $files)"; echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; }
            fi
            sleep $((i * 5))
          done
          echo "push failed"; exit 1

      # FAST publish (15 Oct P0): ONE fast publish per data run: market/macro/derivs-only data goes through publish-derivs.yml (own concurrency group, data gates only,
      # < 8 min). It hands over to the full "CI and deploy" itself when anything else (etf.json, calendar.json, code) differs from the last good deploy.
      - name: Fast publish the new data (publish-derivs.yml)
        if: always() && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          at=$(python3 -c "import json;print(json.load(open('data/_runs.json')).get('last_run') or json.load(open('data/market.json')).get('updated') or '')")
          gh workflow run publish-derivs.yml --repo "$GITHUB_REPOSITORY" --ref main -f derivs_run_at="$at" && echo "dispatched Fast publish for $(git rev-parse --short HEAD), market.json updated $at"
