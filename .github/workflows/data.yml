name: Refresh data
# 17 Nov: a dispatched daily-batch run is titled "Refresh data (full)" so the Cloudflare timer (worker/) can count today's failed batch attempts (back-off)
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.full && 'Refresh data (full)' || 'Refresh data' }}

# 21 Oct (account suspended for excessive automation): ONE data workflow on a slow schedule.
#  - HOURLY at :17 and :47 (9 Nov: two slots, at most one real refresh an hour; the slot job skips a run when derivs were fetched < 45 min ago): derivatives (OI, funding, basis) + market in ONE run, ONE commit, ONE push, ONE fast publish.
#    derivs.yml and publish-derivs.yml are gone (folded in here); the old 4x-an-hour crons on data.yml and derivs.yml are gone.
#  - DAILY batch at 00:20 UTC (after the 00:00 UTC daily closes): macro (FRED) + ETF flows, plus the hourly set.
#    BTC history and ETH/BTC have no server-side job: the app reads them from the exchanges in the browser (Coinbase/Binance), so
#    they follow the 00:00 UTC close on their own. Weekly Thursday 21:00 UTC for the Fed H.4.1 release (WALCL/WDTGAL).
#  Freshness limits: market 3h (21 Oct supervisor ruling, was 2h; shared/freshness.json market_h), OI/basis 5h from the hour start (24 Oct ruling). GitHub runs crons best-effort; a dropped hour shows as stale in the app,
#  and ci.yml's smoke fallback dispatches at most one extra run (only when none is queued/running).
#  17 Nov: outside timer = Cloudflare Worker (worker/, cron :07 hourly) dispatches this workflow at most once an hour, only when derivatives are past 3h old (exactly 3.0h is still fresh)
#  or the daily batch is due (then with full=true), never while a run is queued/in progress. These crons stay as the backup.
on:
  schedule:
    - cron: '17 * * * *'    # hourly: derivs + market
    - cron: '47 * * * *'    # second hourly slot (9 Nov): GitHub drops most scheduled runs; the slot job skips it if :17 already fetched (< 45 min)
    - cron: '20 0 * * *'    # daily batch: macro + ETF (+ hourly set)
    - cron: '0 21 * * 4'    # weekly: Fed H.4.1 (macro)
  workflow_dispatch:
    inputs:
      full:
        description: 'Also run the daily macro + ETF batch'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # gates: request a full CI run when main has untested code

# one data run at a time, never cancelled mid-push; GitHub keeps at most ONE pending run in a group (a newer pending replaces the older),
# so dropped/late crons or extra dispatches can never pile up into overlapping runs (refresh AND its publish are one run).
concurrency:
  group: refresh-data
  cancel-in-progress: false

env:
  SITE_URL: https://atenra-tech.github.io/rp-terminal/
  NODE_PATH: ${{ github.workspace }}/tests/node_modules

jobs:
  # 9 Nov ruling: two hourly slots (:17, :47), at most one real refresh an hour. No checkout: reads main's data/_runs.json last_run
  # through the API and exits before any fetch or deploy if derivatives were fetched under 45 minutes ago (.github/scripts/refresh_slot.py).
  slot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.slot.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Skip this slot if derivatives were fetched in the last 45 minutes (hourly schedules only)
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          for f in macro etf; do gh api "repos/${GITHUB_REPOSITORY}/contents/data/$f.json?ref=main" -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/$f.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/$f.json"; done
          { gh api "repos/${GITHUB_REPOSITORY}/contents/data/_runs.json?ref=main" -H 'Accept: application/vnd.github.raw' 2>/dev/null || echo '{}'; } \
            | python3 .github/scripts/refresh_slot.py "$EVENT" "$SCHEDULE" - "$RUNNER_TEMP/macro.json" "$RUNNER_TEMP/etf.json" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q '^go=' "$GITHUB_OUTPUT" || echo "go=true" >> "$GITHUB_OUTPUT"

  refresh:
    needs: slot
    if: needs.slot.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      sha: ${{ steps.push.outputs.sha }}
      run_at: ${{ steps.push.outputs.run_at }}
    steps:
      # Pushes go over SSH with the repo's write deploy key (secret DATA_DEPLOY_KEY). The main-branch ruleset requires the "test" check
      # and lets only deploy keys bypass it, so this job can keep committing data (hourly + daily batch); the guard below makes sure that key can only ever change data/.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}

      - name: Record the commit this run starts from (guard baseline)
        run: echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide which jobs run
        id: plan
        run: |
          H=$(date -u +%H); M=$(date -u +%M); DOW=$(date -u +%u)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FULL="${{ inputs.full }}"
          elif [ "${{ github.event.schedule }}" = "20 0 * * *" ] || [ "${{ github.event.schedule }}" = "0 21 * * 4" ]; then
            FULL=true
          elif [ "$(python3 .github/scripts/refresh_slot.py --batch-due data/macro.json data/etf.json)" = true ]; then
            FULL=true   # 11 Nov: the 00:20 UTC batch was dropped or failed: the first hourly run (:17 or :47) after that slot does it (checked_at = fetch time)
          else
            FULL=false
          fi
          # 17 Nov light ETF re-fetch: outside the batch, re-run ONLY fetch_etf.py while etf.json's newest BTC/ETH row is pending (never the full batch)
          ETF=$FULL
          if [ "$FULL" != true ] && [ "$(python3 .github/scripts/refresh_slot.py --etf-pending data/etf.json)" = true ]; then ETF=true; fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"; echo "etf=$ETF" >> "$GITHUB_OUTPUT"
          echo "UTC $H:$M (dow $DOW, schedule '${{ github.event.schedule }}') -> daily batch=$FULL, ETF fetch=$ETF"

      - name: Derivatives OI / funding / basis (hourly)
        continue-on-error: true
        run: python scripts/fetch_derivs.py

      - name: Market breadth, dominance, TOTAL2/3 (hourly)
        continue-on-error: true
        run: python scripts/fetch_market.py

      - name: Macro data (daily batch; daily FRED series re-pulled in full each run)
        if: steps.plan.outputs.full == 'true'
        continue-on-error: true
        run: python scripts/fetch_macro.py

      - name: ETF flows (daily batch)
        if: steps.plan.outputs.full == 'true'
        continue-on-error: true
        run: python scripts/fetch_etf.py

      - name: ETF flows, light re-fetch (hourly while the newest BTC/ETH row is pending; writes light_checked_at, never checked_at)
        if: steps.plan.outputs.full != 'true' && steps.plan.outputs.etf == 'true'
        continue-on-error: true
        run: python scripts/fetch_etf.py --light

      - name: Record this run in data/_runs.json (run time, per-feed freshness, rolling 24h hourly sample)
        if: always()
        run: python scripts/runs_log.py

      - name: Validate JSON before commit
        run: |
          for f in data/*.json; do python -c "import json,sys; json.load(open('$f'))" || { echo "invalid $f, restoring"; git checkout -- "$f"; }; done
          rm -f data/*.tmp

      - name: Commit if changed
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -q -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Guard - the data job may only change files under data/
        id: guard
        if: always() && steps.commit.outputs.changed == 'true'
        run: |
          # fail closed: any diff error blocks the push; --no-renames so a file moved into data/ also lists its old (non-data) path
          files=$(git diff --no-renames --name-only "$BASE" HEAD) || { echo "::error::guard could not diff $BASE..HEAD"; exit 1; }
          bad=$(printf '%s\n' "$files" | grep -v -e '^data/' -e '^$' || true)
          if [ -n "$bad" ]; then echo "::error::refusing to push: this job may only change data/, but its commit touches: $(echo $bad)"; exit 1; fi
          echo "guard ok, changed files:"; printf '%s\n' "$files"

      - name: Push (SSH deploy key; guard re-checked on every attempt)
        id: push
        if: always() && steps.commit.outputs.changed == 'true' && steps.guard.outcome == 'success'
        run: |
          # No merge/rebase: a queued run starts from an older commit and its data files conflict with the newer data commit.
          # Instead, start each attempt from the current origin/main and re-apply only the data files this run changed (whole files).
          mine=$(git rev-parse HEAD); msg=$(git log -1 --format=%s "$mine")
          changed=$(git diff --no-renames --name-only "$BASE" "$mine") || { echo "::error::could not list changed files"; exit 1; }
          for i in 1 2 3; do   # bounded: 3 attempts, then the job fails red (no re-dispatch, no retry storm)
            if git fetch -q origin main; then
              git reset -q --hard FETCH_HEAD
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                if git cat-file -e "$mine:$f" 2>/dev/null; then git checkout -q "$mine" -- "$f"; else git rm -q --ignore-unmatch -- "$f"; fi
              done <<< "$changed"
              git add -A -- data/
              if git diff --cached --quiet; then echo "main already has this data, nothing to push"; exit 0; fi
              git commit -q -m "$msg"
              git merge-base --is-ancestor FETCH_HEAD HEAD || { echo "::error::HEAD is not on top of main"; exit 1; }
              files=$(git diff --no-renames --name-only FETCH_HEAD HEAD) || { echo "::error::guard could not diff against main"; exit 1; }
              bad=$(printf '%s\n' "$files" | grep -v -e '^data/' -e '^$' || true)
              if [ -n "$bad" ]; then echo "::error::refusing to push: non-data paths $(echo $bad)"; exit 1; fi
              git push -q origin HEAD:main && { echo "pushed $(git rev-parse --short HEAD): $(echo $files)"; { echo "pushed=true"; echo "sha=$(git rev-parse HEAD)"; echo "run_at=$(python3 -c "import json;print(json.load(open('data/_runs.json')).get('last_run') or '')" 2>/dev/null)"; } >> "$GITHUB_OUTPUT"; exit 0; }
            fi
            sleep $((i * 5))
          done
          echo "push failed"; exit 1

  # ---- publish (folded in from publish-derivs.yml, 21 Oct): runs in THIS run, only after this run pushed data ----
  gates:
    needs: refresh
    if: needs.refresh.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      path: ${{ steps.path.outputs.path }}
      market: ${{ steps.path.outputs.market }}
      sha: ${{ steps.path.outputs.sha }}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.refresh.outputs.sha }}
          fetch-depth: 0
      - name: Path selection (fast only when nothing but derivs.json/_runs.json differs from the last good deploy)
        id: path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 16 Oct (starvation fix): compare with the TESTED code commit (refs/tags/pages-tested), not the last good deploy; the data path always deploys
          good=$(bash .github/scripts/tested_sha.sh)
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -z "$good" ]; then echo "path=fast" >> "$GITHUB_OUTPUT"; echo "code=true" >> "$GITHUB_OUTPUT"; echo "::warning::no tested code commit found"; exit 0; fi
          git fetch -q origin "$good" 2>/dev/null || true; python3 .github/scripts/publish_path.py "$good" HEAD
      - name: Untested code on main - request a full CI run for it (this run still deploys data with the tested code)
        if: steps.path.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # only when no CI run of main is already queued or running (the push run usually is): never piles up runs that replace each other
          busy=$(gh run list --repo "$GITHUB_REPOSITORY" -w ci.yml -b main -L 10 --json status -q '[.[]|select(.status!="completed")]|length' || echo 0)
          if [ "${busy:-0}" -gt 0 ]; then echo "CI already queued/running on main ($busy): no extra dispatch"; exit 0; fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f data_redeploy=false && echo "dispatched full CI (suites) for the untested code"
      - uses: actions/setup-node@v4
        if: steps.path.outputs.path == 'fast'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/package.json
      - name: Install test deps
        if: steps.path.outputs.path == 'fast'
        run: cd tests && npm install --no-audit --no-fund --prefer-offline
      - name: Data gates (blocking, in parallel) - fixture consistency, closed hours, stale-derivs2, stale captions, card presence, OI ÷ supply label, caption sweep
        if: steps.path.outputs.path == 'fast'
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8765/index.html >/dev/null && break; sleep 1; done
          U=http://localhost:8765/index.html; mkdir -p g; t0=$(date +%s)
          # 11 Nov: browser gates load the page through qa/_load.js: they wait for the app's ready signal (never for network idle) and, on this
          # local URL, answer every outside feed from the recorded copies (tests/fixtures/frozen/net, QA_NET=replay) - the result never depends on
          # feed speed. A gate that times out retries once and then FAILS ("timed out"); a timeout is never a pass.
          # watchdog: a browser gate still running after 9 min fails as "timed out" (exit 124) inside the 12-min job limit (stale-derivs2, the slowest, takes 4-6 min)
          export QA_NET=replay QA_GATE_TIMEOUT=540
          node qa/fixture-consistency.js > g/fixture.log 2>&1 & p1=$!
          python3 tests/tclosed_hours.py > g/closed.log 2>&1 & p2=$!
          node qa/stale-derivs2.js $U > g/stale-derivs2.log 2>&1 & p3=$!
          DERIVS_FIXTURE=qa/fixtures/derivs-stale.json node qa/stale-captions.js $U > g/stale-captions.log 2>&1 & p4=$!
          node qa/card-presence.js $U > g/card-presence.log 2>&1 & p5=$!
          node qa/oicap-label.js $U > g/oicap.log 2>&1 & p6=$!
          node qa/caption-sweep.js $U --no-live-news > g/caption-sweep.log 2>&1 & p7=$!
          ps="$p1 $p2 $p3 $p4 $p5 $p6 $p7"
          # WARN-ONLY, never decides publishing: live-headline captions need the real feeds, so they run apart, on the live network, with their own
          # 5-min timeout; not in $ps, its exit code is ignored and it is only reported as a ::warning below
          ( QA_NET=live QA_GATE_TIMEOUT=290 timeout 300 node qa/caption-sweep.js $U --live-news-only > g/caption-sweep-livenews.txt 2>&1 ) & plive=$!
          if [ "${{ steps.path.outputs.market }}" = true ]; then
            # market/macro changed: dollar-token exclusion, breadth rebuild, pulse movers (the caption sweep above already covers captions)
            (cd tests && URL=$U node tdollar.js) > g/tdollar.log 2>&1 & ps="$ps $!"
            python3 tests/tbreadth.py > g/tbreadth.log 2>&1 & ps="$ps $!"
            node qa/pulse-movers.js $U > g/pulse-movers.log 2>&1 & ps="$ps $!"
          fi
          fail=0
          for p in $ps; do wait $p || fail=1; done
          wait $plive && echo "live-news caption sweep (warn-only): $(grep -c 'WARN (live news' g/caption-sweep-livenews.txt || true) warnings" || echo "::warning title=Live-news caption sweep (warn-only)::did not finish cleanly (exit $?); it never blocks publishing - see g/caption-sweep-livenews.txt"
          grep -q 'WARN (live news' g/caption-sweep-livenews.txt && { echo "::warning title=Live-news captions (warn-only)::"; grep 'WARN (live news' g/caption-sweep-livenews.txt | head -10; } || true
          for f in g/tdollar.log; do [ -f $f ] && grep -qE '^FAIL |FAILS: [1-9]' $f && fail=1; done
          for f in g/*.log; do echo "=== $f"; tail -4 "$f"; done
          echo "gates took $(( $(date +%s) - t0 ))s"
          [ $fail = 0 ] || { grep -h "^FAIL\|::error\|timed out\|failed to load" g/*.log | head -20; echo "::error title=Fast publish blocked::a data gate failed; nothing published, live keeps the last good files"; exit 1; }

  deploy:
    # P1 (15 Oct): ONE Pages deploy at a time across ci.yml and data.yml; a second deploy waits (never cancelled mid-deploy)
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: [refresh, gates]
    if: needs.gates.outputs.path == 'fast'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
      actions: read
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url || steps.dep2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gates.outputs.sha }}
          fetch-depth: 0
      # P1 (15 Oct): code from refs/tags/pages-tested (last commit green on test AND live smoke), never the gated/main commit's code; data/ = newest on main
      - name: Snapshot (tested code + newest data/ from main); refuse if code or data older than live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/no_regress.py snapshot live-before.json
          # narrow no-rollback ruling (17 Nov: data.yml too): exact bytes live serves BEFORE this publish, for the smoke's stale-and-unchanged check
          python3 .github/scripts/no_regress.py files live-before-files
          code=$(bash .github/scripts/tested_sha.sh); [ -n "$code" ] || { echo "::error::no tested code commit"; exit 1; }
          bash .github/scripts/snapshot.sh _site "$code"
          # data that arrived after the gates ran gets the two data-only gates again
          cp _site/data/derivs.json data/derivs.json && python3 tests/tclosed_hours.py > closed.log || { cat closed.log; exit 1; }; echo "closed hours OK on deploy-time data"
          # market/macro taken from main HEAD after the gates ran: only publish them if they are the gated files (else keep the gated copy)
          for f in market.json macro.json; do cmp -s "_site/data/$f" "data/$f" || { echo "main has a newer $f than the gated one; publishing the gated $f (the newer one gets its own fast publish)"; cp "data/$f" "_site/data/$f"; }; done
          python3 .github/scripts/no_regress.py check _site
      - name: Log publish timing into _runs.json (published copy)
        env:
          DERIVS_RUN_AT: ${{ needs.refresh.outputs.run_at }}
        run: |
          python3 - <<'PY'
          import json, os, datetime as d
          p = '_site/data/_runs.json'; R = json.load(open(p)); now = d.datetime.now(d.timezone.utc)
          P = lambda s: d.datetime.fromisoformat(s.replace('Z', '+00:00'))
          start = os.environ.get('DERIVS_RUN_AT') or R.get('last_run')
          M = json.load(open('_site/data/market.json')); Mu = M.get('updated')
          pub = {'path': 'fast', 'market_updated': Mu, 'workflow_run': os.environ.get('GITHUB_RUN_ID'), 'derivs_run_at': start,
                 'deploy_started': now.strftime('%Y-%m-%dT%H:%M:%SZ'), 'minutes_to_deploy': round((now - P(start)).total_seconds() / 60, 1) if start else None}
          R['publish'] = pub
          if R.get('runs'): R['runs'][-1]['publish'] = pub
          json.dump(R, open(p, 'w'), separators=(',', ':'))
          print('publish timing', pub)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-before
          path: |
            live-before.json
            live-before-files/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # 24 Nov (data.yml runs 42542550436 44666052932 44880238672 45052955023 45261080418 45371562199): deploy-pages lists this run's artifacts ONCE,
      # ~0.5s after upload-pages-artifact finalised; GitHub's listing had not caught up ("Found 1 artifact(s)" = only live-before) -> "No artifacts named
      # github-pages" and nothing published. Same action versions as GitHub's Pages starter (upload-pages-artifact@v3 = upload-artifact@v4 inside,
      # deploy-pages@v4): not a version mismatch. Fix: give the listing up to 30s, then deploy; on a failure before any Pages deployment was created
      # (page_url empty = the artifact lookup) wait 60s and retry EXACTLY ONCE. Any other deploy failure, or a second failure, fails the job (tests/tdeploy_retry.py).
      - name: Wait until the github-pages artifact is listed for this run (max 30s, never fails)
        env:
          GH_TOKEN: ${{ github.token }}
          ART: github-pages
        run: |
          for i in $(seq 1 10); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ART" --jq .total_count 2>/dev/null || echo 0)
            [ "${n:-0}" -ge 1 ] && { echo "$ART listed (check $i)"; exit 0; }; sleep 3
          done
          echo "::warning::$ART not listed after 30s; deploying anyway (one retry follows if the lookup fails)"
      - id: dep
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pages artifact lookup failed - wait 60s, then retry ONCE
        id: depwait
        if: steps.dep.outcome == 'failure' && steps.dep.outputs.page_url == ''
        run: |
          echo "::warning title=Pages deploy retry::deploy-pages failed before a Pages deployment was created (No artifacts named \"github-pages\" - artifact listing lag); retrying once in 60s"
          sleep 60
      - id: dep2
        if: steps.depwait.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Pages deploy result (fails unless the first deploy or the single retry succeeded)
        if: '!cancelled() && steps.dep.outcome == ''failure'' && steps.dep2.outcome != ''success'''
        run: |
          echo "::error title=Pages deploy failed::first deploy ${{ steps.dep.outcome }} (page_url '${{ steps.dep.outputs.page_url }}'), retry ${{ steps.dep2.outcome || 'not run' }}"
          exit 1

  smoke:
    needs: [gates, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # the run's own headSha is the commit the schedule started from, NOT the data commit this run pushed and deployed;
      # last_good.sh reads the deployed sha from this step's name (rollback restores data/ from it)
      - name: data-sha ${{ needs.gates.outputs.sha }}
        run: echo "deployed data commit ${{ needs.gates.outputs.sha }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/package.json
      - run: cd tests && npm install --no-audit --no-fund --prefer-offline
      - uses: actions/download-artifact@v4
        with:
          name: live-before
      - name: Wait for Pages CDN to serve the new _runs.json
        run: |
          for i in $(seq 1 12); do
            v=$(curl -s "${SITE_URL}data/_runs.json?v=$(date +%s)" | python3 -c "import json,sys;print((json.load(sys.stdin).get('publish') or {}).get('workflow_run'))" 2>/dev/null)
            [ "$v" = "$GITHUB_RUN_ID" ] && { echo "live serves this publish"; break; }; sleep 10
          done
      - name: Live smoke + card presence + live never went backwards (failure rolls back, except stale data this publish did not change)
        # narrow no-rollback ruling: smoke_or_stale.sh passes only when tsmoke passes or fails ONLY on freshness with every stale file byte-identical
        # to pre-publish live (live-before-files/); backwards, card presence and any other failure still roll back (tests/tnorollback.py)
        run: |
          set -e
          python3 .github/scripts/no_regress.py after live-before.json
          bash .github/scripts/smoke_or_stale.sh "$SITE_URL" live-before-files
          node qa/card-presence.js "$SITE_URL"
      - name: End-to-end time
        if: always()
        run: curl -s "${SITE_URL}data/_runs.json?v=$(date +%s)" | python3 -c "import json,sys,datetime as d;R=json.load(sys.stdin);p=R.get('publish') or {};s=p.get('derivs_run_at');n=d.datetime.now(d.timezone.utc);print('derivs run',s,'| live verified',n.strftime('%FT%TZ'),'| end-to-end',round((n-d.datetime.fromisoformat(s.replace('Z','+00:00'))).total_seconds()/60,1) if s else '—','min')" | tee -a "$GITHUB_STEP_SUMMARY"

  rollback:
    # P1 (15 Oct): ONE Pages deploy at a time across ci.yml and data.yml; a second deploy waits (never cancelled mid-deploy)
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: smoke
    if: failure() && needs.smoke.result == 'failure'
    runs-on: ubuntu-latest
    outputs:
      code_sha: ${{ steps.rb.outputs.code_sha }}
      data_updated: ${{ steps.rb.outputs.data_updated }}
    permissions:
      pages: write
      id-token: write
      actions: read
      contents: read
    environment:
      name: github-pages
    steps:
      # 11 Nov: rollback had no checkout before this step, so last_good.sh was "No such file" (exit 127) and no rollback could ever run.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _scripts
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Last good deploy (newest successful CI and deploy or fast publish before this one)
        id: good
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(bash _scripts/.github/scripts/last_good.sh)
          [ -n "$sha" ] || { echo "::error::no previous good deploy"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "rolling back to $sha"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.good.outputs.sha }}
      # rollback is the one deploy allowed to put older data back: the newer data just failed live smoke
      # code from refs/tags/pages-tested (fetched from main's scripts); data/ from the last good deploy commit
      - run: |
          git fetch -q origin main && git show FETCH_HEAD:.github/scripts/tested_sha.sh > "$RUNNER_TEMP/tested_sha.sh"; git fetch -q origin refs/tags/pages-tested:refs/tags/pages-tested || true
          code=$(GITHUB_REPOSITORY= bash "$RUNNER_TEMP/tested_sha.sh"); code=${code:-${{ steps.good.outputs.sha }}}; git fetch -q origin "$code" || true
          mkdir _site && git archive "$code" -- index.html manifest.webmanifest icons $(git cat-file -e "$code:sw.js" 2>/dev/null && echo sw.js) | tar -x -C _site && cp -r data _site/
          python3 -c "import json,sys;json.dump({'code_sha':sys.argv[1],'data_sha':sys.argv[2]},open('_site/build.json','w'))" "$code" "${{ steps.good.outputs.sha }}"
      - name: Publish guard on the exact derivs.json (no test marks, closed hours only, overlapping hours = main)
        run: |
          git fetch -q origin main && git show FETCH_HEAD:.github/scripts/publish_guard.py > "$RUNNER_TEMP/publish_guard.py" && git show FETCH_HEAD:data/derivs.json > "$RUNNER_TEMP/main-derivs.json"
          python3 "$RUNNER_TEMP/publish_guard.py" _site/data/derivs.json "$RUNNER_TEMP/main-derivs.json"
      - name: Record what the rollback restores (for rollback-alert)
        id: rb
        run: |
          echo "code_sha=$(python3 -c "import json;print(json.load(open('_site/build.json')).get('code_sha',''))" 2>/dev/null)" >> "$GITHUB_OUTPUT"
          echo "data_updated=$(python3 -c "import json;print(json.load(open('_site/data/derivs.json')).get('updated',''))" 2>/dev/null)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-rollback
      # 24 Nov (data.yml runs 42542550436 44666052932 44880238672 45052955023 45261080418 45371562199): deploy-pages lists this run's artifacts ONCE,
      # ~0.5s after upload-pages-artifact finalised; GitHub's listing had not caught up ("Found 1 artifact(s)" = only live-before) -> "No artifacts named
      # github-pages" and nothing published. Same action versions as GitHub's Pages starter (upload-pages-artifact@v3 = upload-artifact@v4 inside,
      # deploy-pages@v4): not a version mismatch. Fix: give the listing up to 30s, then deploy; on a failure before any Pages deployment was created
      # (page_url empty = the artifact lookup) wait 60s and retry EXACTLY ONCE. Any other deploy failure, or a second failure, fails the job (tests/tdeploy_retry.py).
      - name: Wait until the github-pages-rollback artifact is listed for this run (max 30s, never fails)
        env:
          GH_TOKEN: ${{ github.token }}
          ART: github-pages-rollback
        run: |
          for i in $(seq 1 10); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ART" --jq .total_count 2>/dev/null || echo 0)
            [ "${n:-0}" -ge 1 ] && { echo "$ART listed (check $i)"; exit 0; }; sleep 3
          done
          echo "::warning::$ART not listed after 30s; deploying anyway (one retry follows if the lookup fails)"
      - id: dep
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-rollback
      - name: Pages artifact lookup failed - wait 60s, then retry ONCE
        id: depwait
        if: steps.dep.outcome == 'failure' && steps.dep.outputs.page_url == ''
        run: |
          echo "::warning title=Pages deploy retry::deploy-pages failed before a Pages deployment was created (No artifacts named \"github-pages-rollback\" - artifact listing lag); retrying once in 60s"
          sleep 60
      - id: dep2
        if: steps.depwait.outcome == 'success'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-rollback
      - name: Pages deploy result (fails unless the first deploy or the single retry succeeded)
        if: '!cancelled() && steps.dep.outcome == ''failure'' && steps.dep2.outcome != ''success'''
        run: |
          echo "::error title=Pages deploy failed::first deploy ${{ steps.dep.outcome }} (page_url '${{ steps.dep.outputs.page_url }}'), retry ${{ steps.dep2.outcome || 'not run' }}"
          exit 1

  rollback-alert:
    # 16 Oct: every completed rollback restores older code/data -> a RED, clearly named job so the supervisor's red-run watch tells the room
    needs: rollback
    if: always() && needs.rollback.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: ROLLBACK HAPPENED - live restored to older code/data
        env:
          RB_CODE: ${{ needs.rollback.outputs.code_sha }}
          RB_DATA: ${{ needs.rollback.outputs.data_updated }}
        run: |
          msg="ROLLBACK in $GITHUB_WORKFLOW run $GITHUB_RUN_ID: live restored to code ${RB_CODE:-unknown}, derivs data updated ${RB_DATA:-unknown}. The rollback deploy completed; this job is red so the room is told."
          echo "::error title=ROLLBACK - live restored::$msg"; echo "### ROLLBACK - live restored" >> "$GITHUB_STEP_SUMMARY"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  stale-alarm:
    # 25 Oct: the stale alarm rides on every scheduled data run (hourly) instead of its own 3h cron, so it adds no scheduled runs
    # (tschedule budget <= 27/day). always(): it must still fire when refresh/gates/deploy failed and live data is ageing.
    # Real clock + live _runs.json on purpose: its job is to catch live data past its limit.
    # 9 Nov: not on a skipped :17/:47 slot (no fetch happened; the run that fetched already raised its own alarm).
    needs: [slot, refresh, gates, deploy, smoke]
    if: always() && needs.slot.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Live data age per feed limit (fails when stale)
        run: python3 .github/scripts/data_age.py "https://atenra-tech.github.io/rp-terminal/data/_runs.json"
