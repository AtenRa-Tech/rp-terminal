name: Refresh data

on:
  schedule:
    # hourly at :17 (derivatives); macro, ETF and market breadth run when the UTC hour is 0/6/12/18,
    # plus Thursday 21:00 and 22:00 UTC (after the Fed's H.4.1 release at 16:30 ET, so WALCL/WDTGAL land the same day)
    # Cron syntax checked (valid, UTC); this file is on the default branch (main) and the workflow state is "active".
    # GitHub runs schedules best-effort (new schedules can take hours to start; runs are delayed or dropped under load),
    # so ci.yml also dispatches this job when derivs.json is over 3h old, and the app shows stale-data warnings per file cadence.
    - cron: '17 * * * *'
    - cron: '0 21 * * 4'
  workflow_dispatch:
    inputs:
      full:
        description: 'Also run the 6-hourly macro + ETF + market fetch'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write   # dispatch "CI and deploy" (data_redeploy) after a data push

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pushes go over SSH with the repo's write deploy key (secret DATA_DEPLOY_KEY). The main-branch ruleset requires the "test" check
      # and lets only deploy keys bypass it, so this job can keep committing data hourly; the guard below makes sure that key can only ever change data/.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}

      - name: Record the commit this run starts from (guard baseline)
        run: echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide which jobs run
        id: plan
        run: |
          H=$(date -u +%H); DOW=$(date -u +%u)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FULL="${{ inputs.full }}"
          elif [ $((10#$H % 6)) -eq 0 ]; then
            FULL=true
          elif [ "$DOW" = "4" ] && { [ "$H" = "21" ] || [ "$H" = "22" ]; }; then
            FULL=true
          else
            FULL=false
          fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "UTC hour $H -> full=$FULL"

      - name: Derivatives OI / funding / basis (hourly)
        continue-on-error: true
        run: python scripts/fetch_derivs.py

      - name: Macro data (every 6h; daily FRED series re-pulled in full each run)
        if: steps.plan.outputs.full == 'true'
        continue-on-error: true
        run: python scripts/fetch_macro.py

      - name: ETF flows (every 6h)
        if: steps.plan.outputs.full == 'true'
        continue-on-error: true
        run: python scripts/fetch_etf.py

      - name: Market breadth, dominance, TOTAL2/3 (every 6h)
        if: steps.plan.outputs.full == 'true'
        continue-on-error: true
        run: python scripts/fetch_market.py

      - name: Validate JSON before commit
        run: |
          for f in data/*.json; do python -c "import json,sys; json.load(open('$f'))" || { echo "invalid $f, restoring"; git checkout -- "$f"; }; done
          rm -f data/*.tmp

      - name: Commit if changed
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -q -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Guard - the data job may only change files under data/
        id: guard
        if: always() && steps.commit.outputs.changed == 'true'
        run: |
          # fail closed: any diff error blocks the push; --no-renames so a file moved into data/ also lists its old (non-data) path
          files=$(git diff --no-renames --name-only "$BASE" HEAD) || { echo "::error::guard could not diff $BASE..HEAD"; exit 1; }
          bad=$(printf '%s\n' "$files" | grep -v -e '^data/' -e '^$' || true)
          if [ -n "$bad" ]; then echo "::error::refusing to push: this job may only change data/, but its commit touches: $(echo $bad)"; exit 1; fi
          echo "guard ok, changed files:"; printf '%s\n' "$files"

      - name: Push (SSH deploy key; guard re-checked on every attempt)
        id: push
        if: always() && steps.commit.outputs.changed == 'true' && steps.guard.outcome == 'success'
        run: |
          # No merge/rebase: a queued run starts from an older commit and its data files conflict with the newer data commit.
          # Instead, start each attempt from the current origin/main and re-apply only the data files this run changed (whole files).
          mine=$(git rev-parse HEAD); msg=$(git log -1 --format=%s "$mine")
          changed=$(git diff --no-renames --name-only "$BASE" "$mine") || { echo "::error::could not list changed files"; exit 1; }
          for i in 1 2 3; do
            if git fetch -q origin main; then
              git reset -q --hard FETCH_HEAD
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                if git cat-file -e "$mine:$f" 2>/dev/null; then git checkout -q "$mine" -- "$f"; else git rm -q --ignore-unmatch -- "$f"; fi
              done <<< "$changed"
              git add -A -- data/
              if git diff --cached --quiet; then echo "main already has this data, nothing to push"; exit 0; fi
              git commit -q -m "$msg"
              git merge-base --is-ancestor FETCH_HEAD HEAD || { echo "::error::HEAD is not on top of main"; exit 1; }
              files=$(git diff --no-renames --name-only FETCH_HEAD HEAD) || { echo "::error::guard could not diff against main"; exit 1; }
              bad=$(printf '%s\n' "$files" | grep -v -e '^data/' -e '^$' || true)
              if [ -n "$bad" ]; then echo "::error::refusing to push: non-data paths $(echo $bad)"; exit 1; fi
              git push -q origin HEAD:main && { echo "pushed $(git rev-parse --short HEAD): $(echo $files)"; echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; }
            fi
            sleep $((i * 5))
          done
          echo "push failed"; exit 1

      # Redeploy: CI ignores data-only pushes, and workflow_run never fires for data runs started by GITHUB_TOKEN, so start the deploy here.
      - name: Redeploy the site with the new data ("CI and deploy", data_redeploy)
        if: always() && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f data_redeploy=true && echo "dispatched CI and deploy (data_redeploy) for $(git rev-parse --short HEAD)"
