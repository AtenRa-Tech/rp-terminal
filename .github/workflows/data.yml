name: Refresh data

on:
  schedule:
    # hourly at :17 (India prices + derivatives); macro, ETF and market breadth run when the UTC hour is 0/6/12/18
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Also run the 6-hourly macro + ETF + market fetch'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide which jobs run
        id: plan
        run: |
          H=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FULL="${{ inputs.full }}"
          elif [ $((10#$H % 6)) -eq 0 ]; then
            FULL=true
          else
            FULL=false
          fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "UTC hour $H -> full=$FULL"

      - name: India prices (hourly)
        run: python scripts/fetch_india.py

      - name: Derivatives OI / funding / basis (hourly)
        continue-on-error: true
        run: python scripts/fetch_derivs.py

      - name: Macro data (every 6h)
        if: steps.plan.outputs.full == 'true'
        run: python scripts/fetch_macro.py

      - name: ETF flows (every 6h)
        if: steps.plan.outputs.full == 'true'
        run: python scripts/fetch_etf.py

      - name: Market breadth, dominance, TOTAL2/3 (every 6h)
        if: steps.plan.outputs.full == 'true'
        continue-on-error: true
        run: python scripts/fetch_market.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"; exit 0
          fi
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "push failed"; exit 1
